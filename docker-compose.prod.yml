version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Octopus App – Production override
#  Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Differences from dev:
#  • App replicas scaled to 3
#  • No exposed ports for Prometheus/Grafana (internal only)
#  • Stricter resource limits
#  • Read-only filesystem for app containers
# ─────────────────────────────────────────────────────────────────

services:

  app:
    image: ${APP_IMAGE:-ghcr.io/danielryazanov/octopus-app:latest}
    build: ~
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    read_only: true
    tmpfs:
      - /tmp

  mongo:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    ports:
      - "80:80"
      - "443:443"

  prometheus:
    ports: []    # Not exposed externally in production

  grafana:
    ports: []    # Not exposed externally in production
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost}
