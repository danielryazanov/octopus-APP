<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐙 Octopus App – Hello World with Apples!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 3rem 4rem;
      text-align: center;
      max-width: 700px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }

    #apple-count {
      font-size: 5rem;
      font-weight: 900;
      color: #f7971e;
      line-height: 1;
    }

    .apple-label {
      font-size: 1.1rem;
      color: #ccc;
      margin-top: 0.5rem;
      margin-bottom: 2.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th {
      background: rgba(247, 151, 30, 0.2);
      color: #ffd200;
      padding: 0.7rem 1rem;
      text-align: left;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    tr:hover td { background: rgba(255,255,255,0.04); }

    .badge {
      display: inline-block;
      background: rgba(247,151,30,0.2);
      color: #ffd200;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    .status {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #555;
    }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍎 Hello World!</h1>
    <p class="subtitle">Octopus App — Live fruit inventory from MongoDB</p>

    <div id="apple-count">…</div>
    <p class="apple-label">🍏 apples currently in stock</p>

    <table id="fruits-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Fruit</th>
          <th>Qty</th>
          <th>Rating</th>
          <th>Extra</th>
        </tr>
      </thead>
      <tbody id="fruits-body">
        <tr><td colspan="5" style="text-align:center;color:#888">Loading…</td></tr>
      </tbody>
    </table>

    <p class="status">
      <span class="dot"></span>
      Connected · Data served live from MongoDB
    </p>
  </div>

  <script>
    async function loadFruits() {
      try {
        const res = await fetch('/api/fruits');
        if (!res.ok) throw new Error('Network error');
        const fruits = await res.json();

        const apple = fruits.find(f => f.name === 'apples');
        document.getElementById('apple-count').textContent =
          apple ? apple.qty : 'N/A';

        const tbody = document.getElementById('fruits-body');
        tbody.innerHTML = fruits.map(f => `
          <tr>
            <td>${f._id}</td>
            <td>${f.name}</td>
            <td>${f.qty}</td>
            <td>${'⭐'.repeat(f.rating)}</td>
            <td>${f.microsieverts != null
              ? `<span class="badge">☢ ${f.microsieverts} µSv</span>`
              : '—'}</td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('apple-count').textContent = 'ERR';
        document.getElementById('fruits-body').innerHTML =
          `<tr><td colspan="5" style="color:#f44">Error loading data: ${err.message}</td></tr>`;
      }
    }

    loadFruits();
  </script>
</body>
</html>
