global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'octopus-app'

scrape_configs:
  - job_name: 'octopus-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
